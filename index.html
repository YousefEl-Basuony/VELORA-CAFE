<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VELORA — Premium Coffee Experience</title>
    <!-- Instant client-side redirect to the Home page inside html/ -->
    <meta http-equiv="refresh" content="0; url=html/Home.html" />
    <script type="text/javascript">
      window.location.href = "html/Home.html";
    </script>
    <style>
      body {
        background-color: #121212;
        color: #d4af37;
        font-family: "Poppins", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        overflow: hidden;
      }
      /* Coffee steam animation */
      body::before {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        background: radial-gradient(
          circle at center,
          rgba(43, 29, 20, 0.6) 0%,
          rgba(18, 18, 18, 1) 70%
        );
        z-index: -1;
      }
      .redirect-container {
        text-align: center;
        background: rgba(255, 255, 255, 0.03);
        padding: 50px 40px;
        border-radius: 24px;
        border: 1px solid rgba(212, 175, 55, 0.15);
        backdrop-filter: blur(15px);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        max-width: 400px;
        width: 90%;
        box-sizing: border-box;
      }
      .logo {
        font-size: 36px;
        font-weight: 600;
        letter-spacing: 4px;
        margin-bottom: 25px;
        color: #d4af37;
        text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
      }
      .spinner {
        border: 3px solid rgba(212, 175, 55, 0.1);
        width: 45px;
        height: 45px;
        border-radius: 50%;
        border-left-color: #d4af37;
        animation: spin 1s linear infinite;
        margin: 0 auto 25px;
        box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
      }
      h2 {
        font-size: 18px;
        font-weight: 400;
        margin: 0 0 10px 0;
        letter-spacing: 1px;
        color: #e5e5e5;
      }
      p {
        font-size: 13px;
        color: #8a8a8a;
        margin: 0;
      }
      a {
        color: #d4af37;
        text-decoration: none;
        font-weight: 600;
        border-bottom: 1px dashed #d4af37;
        transition: all 0.3s ease;
      }
      a:hover {
        color: #fff;
        border-bottom-color: #fff;
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="redirect-container">
      <div class="logo">VELORA</div>
      <div class="spinner"></div>
      <h2>Preparing Your Experience</h2>
      <p>
        If you are not redirected, <a href="html/Home.html">click here</a>.
      </p>
    </div>
  </body>
</html>
